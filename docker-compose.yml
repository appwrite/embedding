services:
  embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODELS: ${EMBEDDING_MODELS:-nomic}
    image: embedding:latest
    container_name: embedding
    ports:
      - "${EMBEDDING_PORT:-3000}:${EMBEDDING_PORT:-3000}"
    env_file:
      - .env
    volumes:
      - models:/home/embedder/models
    restart: unless-stopped

volumes:
  models:
